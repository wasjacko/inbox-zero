<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <title>Hors connexion · Freescale</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fff;
        --foreground: #0f172a;
        --muted: #64748b;
        --mark-background: #eff6ff;
        --mark-foreground: #2563eb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding:
          max(1.5rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
      }

      section {
        width: min(100%, 24rem);
        text-align: center;
      }

      .mark {
        display: grid;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.5rem;
        place-items: center;
        border-radius: 1rem;
        background: var(--mark-background);
        color: var(--mark-foreground);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 8vw, 2.25rem);
        letter-spacing: -0.04em;
        line-height: 1.05;
      }

      p {
        margin: 0.875rem auto 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.55;
      }

      button {
        min-width: 10rem;
        min-height: 2.75rem;
        margin-top: 1.75rem;
        border: 0;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 650;
      }

      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #09090b;
          --foreground: #fafafa;
          --muted: #a1a1aa;
          --mark-background: #172554;
          --mark-foreground: #93c5fd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="offline-title">
        <div aria-hidden="true" class="mark">
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 3.25c.45 4.46 4.04 8.05 8.5 8.5-4.46.45-8.05 4.04-8.5 8.5-.45-4.46-4.04-8.05-8.5-8.5 4.46-.45 8.05-4.04 8.5-8.5Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1 id="offline-title">Connexion interrompue</h1>
        <p>
          Freescale n’a pas accès au réseau. Vos données restent protégées et
          rien ne sera envoyé tant que la connexion n’est pas revenue.
        </p>
        <button onclick="location.reload()" type="button">Réessayer</button>
      </section>
    </main>
  </body>
</html>
